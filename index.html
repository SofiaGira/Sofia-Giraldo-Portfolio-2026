<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sofia Portfolio</title>

  <!-- GOOGLE FONTS -->

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">

  <!-- CSS -->

  <link rel="stylesheet" href="style.css">

</head>

<body>

<nav>

  <!-- LOGO -->

  <div class="logo">
    portfolio
  </div>

  <!-- MENU BUTTON -->

  <button class="menu-btn" id="menu-btn">

    MENU

  </button>

</nav>

<!-- DROPDOWN MENU -->

<div class="menu" id="menu">

  <a href="#about">About Me</a>

  <a href="#projects">Portfolio</a>

  <a href="#contact">Contact Me</a>

</div>

  <!-- HERO -->

  <section id="hero" class="hero">

    <!-- TEXT -->

    <div class="hero-text">

      <p class="small-text">
        Hey. I'm Sofia,
      </p>

      <h1>
        An Environmental <br>
        Design <br>
        Student
      </h1>

      <p class="hero-description">

        I enjoy designing with a particular focus on public
        space, environment protection, social engagement,
        and urban transformation and innovation.

      </p>

      <!-- BUTTON -->

      <a href="#contact" class="contact-btn">

        Contact Me

        <span class="arrow">
          →
        </span>

      </a>

    </div>

    <!-- IMAGE -->

    <div class="hero-image">

      <img src="images/profile.jpg" alt="Profile Photo">

    </div>

  </section>

  <!-- CONTACT -->

  <section id="contact" class="contact">

    <h2>
      Let's Work Together
    </h2>

    <form id="contact-form">

  <input
    type="text"
    name="name"
    placeholder="Your Name"
    required
  >

  <input
    type="email"
    name="email"
    placeholder="Your Email"
    required
  >

  <textarea
    name="message"
    placeholder="Your Message"
    required
  ></textarea>

  <button type="submit" class="send-btn">
    Send Message
  </button>

</form>

  </section>

  <!-- JS -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="js/script.js"></script>

</body>

</html>
