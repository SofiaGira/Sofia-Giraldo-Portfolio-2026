<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sofia Portfolio</title>

  <!-- GOOGLE FONTS -->

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">

  <!-- CSS -->

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <!-- NAVBAR -->

  <nav>

    <div class="logo">
      SOFIA
    </div>

    <ul>

      <li><a href="#hero">Home</a></li>

      <li><a href="#contact">Contact</a></li>

    </ul>

  </nav>

  <!-- HERO -->

  <section id="hero" class="hero">

    <!-- TEXT -->

    <div class="hero-text">

      <p class="small-text">
        Hey. I'm Sofia,
      </p>

      <h1>
        A UI/UX <br>
        & Brand <br>
        Designer
      </h1>

      <p class="hero-description">

        Transforming ideas into stunning digital experiences
        through thoughtful design, creativity and innovation.

      </p>

      <!-- BUTTON -->

      <a href="#contact" class="contact-btn">

        Contact Me

        <span class="arrow">
          →
        </span>

      </a>

    </div>

    <!-- IMAGE -->

    <div class="hero-image">

      <img src="images/profile.jpg" alt="Profile Photo">

    </div>

  </section>

  <!-- CONTACT -->

  <section id="contact" class="contact">

    <h2>
      Let's Work Together
    </h2>

    <form>

      <input type="text" placeholder="Your Name">

      <input type="email" placeholder="Your Email">

      <textarea placeholder="Your Message"></textarea>

      <button class="send-btn">
        Send Message
      </button>

    </form>

  </section>

  <!-- JS -->

  <script src="js/script.js"></script>

</body>

</html>
